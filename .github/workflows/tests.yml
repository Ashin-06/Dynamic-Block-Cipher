name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Test on Linux with GUI display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -v
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -v
      - name: Compile modules
        run: python -m compileall -q cipher.py gui.py pq_key_exchange.py demo.py avalanche_demo.py
